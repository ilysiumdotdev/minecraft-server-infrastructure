apiVersion: v1
kind: ServiceAccount
metadata:
  name: velocity
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velocity-server-sleep-manager
  namespace: minecraft
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velocity-server-sleep-manager-binding
  namespace: minecraft
subjects:
  - kind: ServiceAccount
    name: velocity
    namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velocity-server-sleep-manager
