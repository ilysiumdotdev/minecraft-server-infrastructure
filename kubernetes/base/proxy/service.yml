apiVersion: v1
kind: Service
metadata:
  name: velocity
  namespace: minecraft
spec:
  type: ClusterIP
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: minecraft-bedrock
      port: 19132
      targetPort: 19132
      protocol: UDP
  selector:
    app.kubernetes.io/name: velocity
