apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity
  namespace: minecraft
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: velocity
      app.kubernetes.io/instance: velocity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velocity
        app.kubernetes.io/instance: velocity
    spec:
      initContainers:
        - name: install-kubectl
          image: alpine/kubectl:v1.36.0
          command:
            ["sh", "-c", "cp $(which kubectl) /tools/kubectl && chmod +x /tools/kubectl"]
          volumeMounts:
            - name: tools
              mountPath: /tools

      containers:
        - name: velocity
          image: itzg/mc-proxy:2026.7.1-java25
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: PATH
              value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          ports:
            - name: minecraft
              containerPort: 25565
              protocl: TCP
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: velocity-config
              mountPath: /config/velocity.toml
              subPath: velocity.toml
            - name: velocity-config
              mountPath: /config/plugins/MiniMOTD/main.conf
              subPath: minimotd.conf
            - name: velocity-config
              mountPath: /config/plugins/autostartstop/config.yml
              subPath: autostartstop.yml

      volumes:
        - name: tools
          emptyDir: {}
        - name: velocity-config
          configMap:
            name: velocity-runtime-config
