apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc-server
  namespace: minecraft
spec:
  serviceName: mc
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
      app.kubernetes.io/instance: mc-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
        app.kubernetes.io/instance: mc-server
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server:2026.7.2-java25
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          ports:
            - name: minecraft
              containerPort: 25565
            - name: rcon
              containerPort: 25575
          env:
            - name: TYPE
              value: "paper"
            - name: EULA
              value: "true"
            - name: ONLINE_MODE
              value: "false"
            - name: ENABLE_WHITELIST
              value: "true"
            - name: ENABLE_RCON
              value: "true"
            - name: STOP_DURATION
              value: "60"
            - name: LOG_LEVEL
              value: "info"
          readinessProbe:
            exec:
              command: ["mc-monitor", "status", "--host", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
