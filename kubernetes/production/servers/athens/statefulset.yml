apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mc-athens
spec:
  serviceName: mc-athens
  selector:
    matchLabels:
      app.kubernetes.io/name: mc-athens
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mc-athens
    spec:
      containers:
        - name: minecraft
          envFrom:
            - configMapRef:
                name: mc-athens-config
            - secretRef:
                name: mc-athens-rcon-creds
          volumeMounts:
            - name: paper-global
              mountPath: /config/paper-global.yml
              subPath: paper-global.yml
      volumes:
        - name: paper-global
          secret:
            secretName: mc-athens-paper-global
