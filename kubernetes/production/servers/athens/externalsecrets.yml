apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: athens-mc-rcon-secret
  namespace: minecraft
spec:
  secretStoreRef:
    kind: SecretStore
    name: minecraft-secret-store
  refreshPolicy: Periodic
  refreshInterval: "1h0m0s"
  target:
    name: athens-mc-rcon-secret
    creationPolicy: Owner
  data:
    - secretKey: rcon_password
      remoteRef:
        key: minecraft/servers/athens/rcon
        property: password
