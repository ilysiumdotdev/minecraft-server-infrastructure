version: "1"

servers:
  athens:
    control_api:
      type: "shell"
      start_command: "kubectl scale statefulset/mc-athens -n minecraft --replicas=1"
      stop_command: "kubectl scale statefulset/mc-athens -n minecraft --replicas=0"
  thebes:
    control_api:
      type: "shell"
      start_command: "kubectl scale statefulset/mc-thebes -n minecraft --replicas=1"
      stop_command: "kubectl scale statefulset/mc-thebes -n minecraft --replicas=0"

rules:
  auto_start_on_connect:
    triggers:
      - connection:
          deny_connection: true
          server_list:
            mode: whitelist
    action:
      - if:
          mode: all
          checks:
            - server_status:
                server: ${connection.server.name}
                status: offline
          then:
            - log:
                level: INFO
                message: "Connection from ${connection.player.name} triggered server auto start."
            - start:
                server: ${connection.server.name}
            - while:
                mode: all
                checks:
                  - server_status:
                      server: ${connection.server.name}
                      status: offline
                do:
                  - log:
                      level: INFO
                      message: "Waiting for server to start..."
                timeout: 2m
                update_interval: 10s
      - allow_connection:
          connection: ${connection}
          server: ${connection.server}
  auto_sleep_on_empty:
    triggers:
      - empty_server:
          empty_time: 1m
    action:
      - log:
          level: INFO
          message: "Server ${empty_server.server.name} has been empty for ${empty_server.empty_time}. Shutting down server..."
      - stop:
          server: ${empty_server.server.name}
